name: Drive round-trip test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install Drive client
        run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - name: Verify full archive round trip
        env:
          RCLONE_CONFIG_DRIVE_TYPE: drive
          RCLONE_CONFIG_DRIVE_SCOPE: drive
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          RCLONE_CONFIG_DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          SOURCE: ${{ secrets.DRIVE_SOURCE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$SOURCE" && test -n "$RCLONE_CONFIG_DRIVE_TOKEN"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          rclone copyto "drive:$SOURCE" "$work/source.zip" --log-level ERROR
          test "$(stat -c %s "$work/source.zip")" = 959453558
          unzip -tq "$work/source.zip" >/dev/null
          target="Soundtrack-Processor-Tests/roundtrip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          rclone copyto "$work/source.zip" "drive:$target" --immutable --log-level ERROR
          rclone copyto "drive:$target" "$work/returned.zip" --log-level ERROR
          cmp -s "$work/source.zip" "$work/returned.zip"
          echo "PASS: 959453558 bytes; ZIP integrity and byte-for-byte round trip verified."
          rclone deletefile "drive:$target" --log-level ERROR
