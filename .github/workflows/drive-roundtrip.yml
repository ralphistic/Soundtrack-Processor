name: Drive round-trip test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install Drive client
        run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - name: Verify full archive round trip
        env:
          RCLONE_CONFIG_DRIVE_TYPE: drive
          RCLONE_CONFIG_DRIVE_SCOPE: drive
          RCLONE_CONFIG_DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          RCLONE_CONFIG_DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          SOURCE: ${{ secrets.DRIVE_SOURCE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for key in SOURCE RCLONE_CONFIG_DRIVE_TOKEN RCLONE_CONFIG_DRIVE_CLIENT_ID RCLONE_CONFIG_DRIVE_CLIENT_SECRET; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing secret for $key"; exit 1; fi
          done
          command -v unzip >/dev/null
          command -v cmp >/dev/null
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          echo "Stage 1: Download original archive"
          rclone copyto "drive:$SOURCE" "$work/source.zip" --log-level ERROR >"$work/transfer.log" 2>&1 || { echo "::error::Source download failed (authorization, path or network)."; exit 1; }
          test "$(stat -c %s "$work/source.zip")" = 959453558
          unzip -tq "$work/source.zip" >/dev/null
          target="Soundtrack-Processor-Tests/roundtrip-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          echo "Stage 2: Upload separate test archive"
          rclone copyto "$work/source.zip" "drive:$target" --immutable --log-level ERROR >"$work/transfer.log" 2>&1 || { echo "::error::Return upload failed."; exit 1; }
          echo "Stage 3: Download returned archive"
          rclone copyto "drive:$target" "$work/returned.zip" --log-level ERROR >"$work/transfer.log" 2>&1 || { echo "::error::Return download failed."; exit 1; }
          cmp -s "$work/source.zip" "$work/returned.zip"
          echo "PASS: 959453558 bytes; ZIP integrity and byte-for-byte round trip verified."
          rclone deletefile "drive:$target" --log-level ERROR >"$work/transfer.log" 2>&1 || { echo "::warning::Verified test copy could not be moved to trash."; }
